[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-pack-tools"
version = "1.0.0"
description = "Guarded CLI, GTK4 GUI, and build-time validator for packwiz Fabric Minecraft packs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["tomli-w"]

[project.scripts]
minecraft-pack = "minecraft_pack.cli:main"
minecraft-pack-validate = "minecraft_pack.validate_cli:main"
minecraft-pack-manager = "minecraft_pack.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/minecraft_pack/gui.py" = ["ANN", "E402"]
"tests/test_gui.py" = ["ANN"]
