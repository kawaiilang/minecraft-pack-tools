name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies and run unit + GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-setuptools python3-wheel python3-tomli-w \
            python3-gi gir1.2-gtk-4.0 xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --no-index --no-deps --no-build-isolation .
          .venv/bin/minecraft-pack --help >/dev/null
          .venv/bin/minecraft-pack-validate --help >/dev/null
          export PYTHONPATH="$PWD/src:$PWD/tests:$PWD/tests/fixtures"
          .venv/bin/python -m unittest -v test_cli test_fabric test_transaction
          xvfb-run -a .venv/bin/python tests/test_gui.py
